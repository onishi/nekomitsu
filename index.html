<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ead9" />
    <title>ねこみつ — 猫は液体</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
  </head>
  <body>
    <canvas id="game" aria-label="金魚鉢に猫を落とすゲーム"></canvas>
    <div id="hud">
      <div class="pill stage"><span class="label" id="hudLabel">STAGE</span><b id="stageNum">1</b></div>
      <h1 class="title"><button id="titleBtn" type="button" aria-haspopup="dialog">ねこみつ</button></h1>
      <div class="right">
        <button id="autoBtn" class="toggle" type="button" aria-pressed="false" title="オートモード（自動で落として、クリアしたら次へ）">
          <svg class="play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
          <svg class="stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg>
        </button>
      <button id="soundBtn" class="icon" aria-label="サウンドOFF" title="サウンド ON/OFF">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      </div>
    </div>
    <div id="hint">左右に動かして、タップで落とす</div>
    <div id="best" aria-live="off">ハイスコア <b id="bestNum">0</b></div>
    <div id="clear" hidden>
      <div class="card">
        <div class="sub">猫でいっぱい！</div>
        <button id="nextBtn">つぎのステージへ</button>
      </div>
    </div>
    <div id="over" hidden>
      <div class="card">
        <div class="sub">おしまい</div>
        <div class="score">スコア <b id="overScore">0</b></div>
        <div class="best" id="overBest"></div>
        <button id="retryBtn" type="button">もういちど</button>
      </div>
    </div>
    <dialog id="menu" aria-labelledby="menuLead">
      <p id="menuLead" class="lead">あそぶゲームをえらんでね</p>
      <div class="modes">
        <button class="mode" type="button" data-mode="mitsu">
          <span class="name">ねこみつ</span>
          <span class="desc">猫を落として、金魚鉢をいっぱいにする</span>
        </button>
        <button class="mode" type="button" data-mode="keshi">
          <span class="name">ねこけし</span>
          <span class="desc">くっつけて合体。大きくなると消える</span>
        </button>
      </div>
      <p class="note" id="menuNote">えらぶと最初から始まります</p>
      <button id="menuClose" type="button" class="secondary">つづける</button>
      <p class="credit">
        猫の鳴き声: Virtual_Vibes（<a href="https://pixabay.com/" target="_blank" rel="noopener">Pixabay</a>）
        · <a href="https://ko-fi.com/virtualvibes" target="_blank" rel="noopener">Ko-fi で支援</a>
      </p>
      <!-- 隠しリンク: ねこ図鑑 -->
      <a class="secret" href="./zukan.html" aria-label="ねこ図鑑" title="🐾">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="currentColor"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><ellipse cx="5.6" cy="10.4" rx="2" ry="2.5"/><ellipse cx="9.4" cy="6.6" rx="2" ry="2.6"/><ellipse cx="14.6" cy="6.6" rx="2" ry="2.6"/><ellipse cx="18.4" cy="10.4" rx="2" ry="2.5"/></g></svg>
      </a>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
